<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Reprodução</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         CABEÇALHO
    =============================== -->

    <header class="header">

        <div class="header-content">

            <div class="brand">

                <div class="brand-icon">
                    🐦
                </div>

                <div>
                    <h1>Reprodução</h1>
                    <span>Controle de aves</span>
                </div>

            </div>

            <div class="header-status">
                <span class="status-dot"></span>
                Sistema ativo
            </div>

        </div>

    </header>


    <!-- ==============================
         NAVEGAÇÃO
    =============================== -->

    <nav class="main-nav">

        <button
            class="nav-button active"
            id="navGaiolas"
            onclick="mostrarTela('gaiolas')"
        >
            <span>🏠</span>
            Gaiolas
        </button>

        <button
            class="nav-button"
            id="navAves"
            onclick="mostrarTela('aves')"
        >
            <span>🐦</span>
            Aves
        </button>

    </nav>


    <!-- ==============================
         CONTEÚDO
    =============================== -->

    <main class="main-content">


        <!-- ==========================
             TELA DE GAIOLAS
        =========================== -->

        <section id="telaGaiolas" class="screen">

            <div class="page-header">

                <div>
                    <span class="page-overline">
                        CONTROLE
                    </span>

                    <h2>
                        Minhas gaiolas
                    </h2>

                    <p>
                        Acompanhe a reprodução de cada casal.
                    </p>
                </div>

                <div class="total-counter">

                    <strong id="totalGaiolas">
                        5
                    </strong>

                    <span>
                        gaiolas
                    </span>

                </div>

            </div>


            <div
                id="listaGaiolas"
                class="gaiolas-list"
            ></div>

        </section>


        <!-- ==========================
             TELA DE DETALHES DA GAIOLA
        =========================== -->

        <section
            id="telaGaiolaDetalhe"
            class="screen hidden"
        >

            <button
                class="back-button"
                onclick="voltarGaiolas()"
            >
                ← Voltar para gaiolas
            </button>


            <div
                id="gaiolaDetalhe"
            ></div>

        </section>


        <!-- ==========================
             TELA DE AVES
        =========================== -->

        <section
            id="telaAves"
            class="screen hidden"
        >

            <div class="page-header">

                <div>

                    <span class="page-overline">
                        PLANTEL
                    </span>

                    <h2>
                        Minhas aves
                    </h2>

                    <p>
                        Consulte as informações e genealogia.
                    </p>

                </div>

                <div class="total-counter">

                    <strong id="totalAves">
                        0
                    </strong>

                    <span>
                        aves
                    </span>

                </div>

            </div>


            <div class="search-box">

                <span class="search-icon">
                    🔎
                </span>

                <input
                    type="text"
                    id="pesquisaAnilha"
                    placeholder="Pesquisar por anilha..."
                    oninput="pesquisarAves()"
                >

            </div>


            <div
                id="listaAves"
                class="aves-list"
            ></div>

        </section>


        <!-- ==========================
             TELA DE DETALHES DA AVE
        =========================== -->

        <section
            id="telaAveDetalhe"
            class="screen hidden"
        >

            <button
                class="back-button"
                onclick="voltarAves()"
            >
                ← Voltar para aves
            </button>


            <div
                id="aveDetalhe"
            ></div>

        </section>

    </main>


    <!-- ==============================
         RODAPÉ
    =============================== -->

    <footer class="footer">

        Desenvolvido por Gustavo Matos, todos os direitos reservados

    </footer>


    <script src="script.js"></script>

</body>

</html>
